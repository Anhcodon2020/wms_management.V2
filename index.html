<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ - Hệ Thống WMS</title>
    <!-- Them font chu Google Poppins cho dep mat -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }
        h1 { color: #2c3e50; margin-bottom: 10px; font-weight: 600; }
        p { color: #5f6368; line-height: 1.6; }
        .status-box {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            font-weight: bold;
            transition: all 0.3s;
        }
        /* Các class này sẽ được server chèn vào */
        .status-success { color: #155724; background-color: #d4edda; border-color: #c3e6cb; box-shadow: 0 4px 6px rgba(40, 167, 69, 0.1); }
        .status-error { color: #721c24; background-color: #f8d7da; border-color: #f5c6cb; box-shadow: 0 4px 6px rgba(220, 53, 69, 0.1); }
    </style>
</head>
<body>
    <div class="card">
        <h1>🏭 WMS Management</h1>
        <p>Chào mừng bạn đến với hệ thống quản lý kho.</p>
        
        <!-- Đây là nơi Server sẽ điền thông báo kết nối -->
        <div class="status-box {{STATUS_CLASS}}">
            {{DB_STATUS_TEXT}}
        </div>
    </div>

    <script>
        // Ham kiem tra ket noi database lien tuc
        function checkConnection() {
            fetch('/check-db')
                .then(response => response.json())
                .then(data => {
                    if (data.connected) {
                        // Neu da ket noi, chuyen huong ngay lap tuc
                        console.log('Ket noi thanh cong! Dang chuyen huong...');
                        window.location.href = '/dashboard';
                    } else {
                        // Neu chua, thu lai sau 2 giay
                        setTimeout(checkConnection, 2000);
                    }
                })
                .catch(err => console.error('Loi kiem tra:', err));
        }

        // Bat dau kiem tra ngay khi load trang
        checkConnection();
    </script>
</body>
</html>

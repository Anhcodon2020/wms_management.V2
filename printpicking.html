<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In Picking List - WMS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Times New Roman', serif; margin: 0; padding: 20px; background: #f0f0f0; }
        .no-print-zone {
            background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex; gap: 10px; justify-content: center; align-items: center; margin-bottom: 20px;
            position: sticky; top: 0; z-index: 1000;
        }
        .btn { padding: 10px 25px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-print { background: #8e44ad; color: white; }
        .btn-close { background: #95a5a6; color: white; }

        @page { size: A4 portrait; margin: 10mm; }

        @media print {
            .no-print-zone { display: none !important; }
            body { background: none; padding: 0; }
            .picking-page {
                box-shadow: none !important;
                margin: 0 !important;
                border: none !important;
                page-break-after: always;
                break-after: page;
            }
            .picking-page:last-child {
                page-break-after: auto;
                break-after: auto;
            }
        }

        .picking-page {
            background: #fff;
            width: 210mm;
            min-height: 277mm;
            margin: 0 auto 20px auto;
            padding: 10mm;
            box-sizing: border-box;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            position: relative;
        }
        .picking-header { border-bottom: 3px double #000; margin-bottom: 20px; padding-bottom: 10px; }
        .picking-title-box { display: flex; justify-content: space-between; align-items: center; }
        .job-box { text-align: right; border: 2px solid #000; padding: 5px 15px; min-width: 150px; }
        .picking-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
        .picking-table th, .picking-table td { border: 1px solid black; padding: 6px 4px; text-align: left; }
        .picking-table th { background-color: #f2f2f2; font-weight: bold; text-transform: uppercase; }
        .fdc-group-title { background-color: #eee; font-weight: bold; padding: 5px; margin-top: 15px; border: 1px solid #000; font-size: 14px; }
        .total-row { font-weight: bold; background-color: #fafafa; }
        .footer-note { margin-top: 30px; font-style: italic; font-size: 12px; }
    </style>
</head>
<body>
    <div class="no-print-zone">
        <span style="font-weight: bold; color: #8e44ad;">Xem Truoc Ban In Picking List</span>
        <button class="btn btn-print" onclick="window.print()">THUC HIEN IN</button>
        <button class="btn" style="background: #27ae60; color: white;" onclick="exportPickingToExcel()">XUAT EXCEL</button>
        <button class="btn btn-close" onclick="window.close()">Dong cua so</button>
    </div>

    <div id="printContainer"></div>

    <script>
        async function exportPickingToExcel() {
            const raw = localStorage.getItem('printPickingData');
            if (!raw) return;
            const data = JSON.parse(raw);
            await Promise.all([
                applyInventoryLocIds(data),
                applyMasterDataWeights(data)
            ]);
            let exportData = [];
            data.forEach(job => {
                [...(job.items || [])].sort(sortByKgDesc).forEach(item => {
                    exportData.push({
                        "Job No": job.jobNo,
                        "FDC": item.fdc || 'N/A',
                        "Parent PO": item.parentpo || '',
                        "Child PO": item.childpo || '',
                        "SKU": item.sku || '',
                        "Vi tri": getPickingLocation(item),
                        "Carton": parseFloat(item.carton) || 0,
                        "CBM/SKU": getSkuCbm(item),
                        "CBM": parseFloat(item.cbm) || 0,
                        "KG/SKU": getSkuWeight(item)
                    });
                });
            });
            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "PickingList");
            XLSX.writeFile(wb, document.title + ".xlsx");
        }

        function mapChipboardName(val) {
            if (!val) return '-';
            const s = val.toString();
            if (s.includes('1910')) return '1.9';
            if (s.includes('1210')) return '1.2';
            if (s.includes('1610')) return '1.6';
            return s;
        }

        function getPickingLocation(row) {
            return row.inventory_loc_ids || row.inventory_loc_id || 'Đang cập nhật';
        }

        function normalizeSku(value) {
            return String(value || '').replace(/[\s\u00a0]/g, '').trim().toLowerCase();
        }

        function formatKg(value) {
            const num = Number(value);
            if (!Number.isFinite(num) || num === 0) return '-';
            return Number.isInteger(num) ? String(num) : String(Number(num.toFixed(3)));
        }

        function getSkuWeightNumber(row) {
            const num = Number(row.master_weight ?? row.weight);
            return Number.isFinite(num) ? num : 0;
        }

        function getSkuWeight(row) {
            return formatKg(row.master_weight ?? row.weight);
        }

        function getSkuCbm(row) {
            const num = Number(row.master_cbm);
            return Number.isFinite(num) && num > 0 ? Number(num.toFixed(4)) : '-';
        }

        function sortByKgDesc(a, b) {
            const kgDiff = getSkuWeightNumber(b) - getSkuWeightNumber(a);
            if (kgDiff !== 0) return kgDiff;
            if (a.parentpo !== b.parentpo) return String(a.parentpo || '').localeCompare(String(b.parentpo || ''));
            return String(a.sku || '').localeCompare(String(b.sku || ''));
        }

        let masterDataCache = null;
        async function loadMasterDataMap() {
            if (masterDataCache) return masterDataCache;
            try {
                const response = await fetch('/api/masterdata');
                if (!response.ok) throw new Error('Khong tai duoc master data');

                const data = await response.json();
                masterDataCache = data.reduce((map, item) => {
                    const key = normalizeSku(item.sku);
                    if (!key) return map;
                    if (!map[key] || Number(item.weight || 0) > 0) {
                        map[key] = item;
                    }
                    return map;
                }, {});
                return masterDataCache;
            } catch (error) {
                console.warn(error);
                return {};
            }
        }

        async function applyMasterDataWeights(jobData) {
            const masterDataMap = await loadMasterDataMap();
            jobData.forEach(job => {
                (job.items || []).forEach(item => {
                    const masterItem = masterDataMap[normalizeSku(item.sku)];
                    if (masterItem) {
                        item.master_weight = masterItem.weight;
                        item.master_cbm = masterItem.cbm;
                    }
                });
            });
        }

        async function applyInventoryLocIds(jobData) {
            const skus = [...new Set(jobData.flatMap(job => (job.items || []).map(item => item.sku)).filter(Boolean))];
            if (skus.length === 0) return;

            try {
                const response = await fetch('/api/inventory-whs/loc-ids', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ skus })
                });
                if (!response.ok) throw new Error('Khong tai duoc loc_id tu inventory_whs');

                const locMap = await response.json();
                jobData.forEach(job => {
                    (job.items || []).forEach(item => {
                        const locIds = locMap[normalizeSku(item.sku)];
                        if (locIds) item.inventory_loc_ids = locIds;
                    });
                });
            } catch (error) {
                console.warn(error);
            }
        }

        // Logic render trang chính
        const container = document.getElementById('printContainer');
        const rawData = localStorage.getItem('printPickingData');
        if (!rawData) { // Nếu không có dữ liệu, hiển thị thông báo
            container.innerHTML = "<div style='text-align:center; padding:50px;'><h1>Khong tim thay du lieu Picking!</h1></div>";
        } else {
            const jobData = JSON.parse(rawData);
            Promise.all([
                applyInventoryLocIds(jobData),
                applyMasterDataWeights(jobData)
            ]).then(() => {

            if (jobData.length === 1) {
                document.title = "PickingList_" + jobData[0].jobNo;
            } else {
                document.title = "PickingList_Batch";
            }

            jobData.forEach(job => {
                if (!job.items || job.items.length === 0) return;

                const first = job.items[0];
                const rcvDate = first.datercv ? new Date(first.datercv).toLocaleDateString('vi-VN') : '-';

                const groups = {};
                job.items.forEach(item => {
                    const fdc = item.fdc || 'N/A';
                    if (!groups[fdc]) groups[fdc] = [];
                    groups[fdc].push(item);
                });

                Object.keys(groups).forEach(fdc => {
                    groups[fdc].sort(sortByKgDesc);

                    let fdcCarton = 0;
                    let fdcCbm = 0;

                    let pageHtml = `
                        <div class="picking-page">
                            <div class="picking-header">
                                <div class="picking-title-box">
                                    <h1 style="margin:0;">PICKING LIST</h1>
                                    <div class="job-box">
                                        <div style="font-size: 10px;">JOB NUMBER</div>
                                        <div style="font-size: 22px; font-weight: bold;">${job.jobNo}</div>
                                    </div>
                                </div>
                                <div style="display:flex; justify-content:space-between; margin-top:15px; font-size: 13px;">
                                    <span><b>Ngay nhan:</b> ${rcvDate}</span>
                                    <span><b>Ngay in:</b> ${new Date().toLocaleDateString('vi-VN')}</span>
                                </div>
                            </div>
                            <div class="fdc-group-title">FDC: ${fdc}</div>
                            <table class="picking-table">
                                <thead>
                                    <tr>
                                        <th style="width:12%">Parent PO</th>
                                        <th style="width:12%">Child PO</th>
                                        <th style="width:22%">SKU</th>
                                        <th style="width:12%">Vi tri</th>
                                        <th style="width:8%">Bang</th>
                                        <th style="width:10%">Carton</th>
                                        <th style="width:10%">CBM/SKU</th>
                                        <th style="width:10%">CBM</th>
                                        <th style="width:8%">Chip</th>
                                        <th style="width:12%">KG/SKU</th>
                                    </tr>
                                </thead>
                                <tbody>`;

                    groups[fdc].forEach(row => {
                        fdcCarton += parseFloat(row.carton || 0);
                        fdcCbm += parseFloat(row.cbm || 0);
                        pageHtml += `
                            <tr>
                                <td>${row.parentpo || '-'}</td>
                                <td>${row.childpo || '-'}</td>
                                <td><b>${row.sku || '-'}</b></td>
                                <td>${getPickingLocation(row)}</td>
                                <td style="text-align:center">${row.looscarton || 'N'}</td>
                                <td style="text-align:center; font-weight:bold">${row.carton || 0}</td>
                                <td style="text-align:center">${getSkuCbm(row)}</td>
                                <td>${parseFloat(row.cbm || 0).toFixed(3)}</td>
                                <td style="text-align:center">${mapChipboardName(row.chipboard)}</td>
                                <td style="text-align:center">${getSkuWeight(row)}</td>
                            </tr>`;
                    });

                    pageHtml += `
                                <tr class="total-row">
                                    <td colspan="5" style="text-align:right">Tong ${fdc}:</td>
                                    <td style="text-align:center">${fdcCarton}</td>
                                    <td colspan="4">${fdcCbm.toFixed(3)}</td>
                                </tr>
                            </tbody>
                        </table>
                        <div class="footer-note">
                            * Ghi chu: Nhan vien kho kiem tra ky SKU va so luong khi lay hang. Moi sai sot phai bao ngay cho quan ly.
                        </div>
                    </div>`;

                    container.innerHTML += pageHtml;
                });
            });
            });
        }
    </script>
</body>
</html>
